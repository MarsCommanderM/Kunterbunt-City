# Kunterbunt City – führt bei jedem Push/PR alle Qualitäts-Tore aus (kostenlos auf GitHub).
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - name: Godot laden (headless)
        run: |
          curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot && rm g.zip
      - run: bash scripts/check.sh
